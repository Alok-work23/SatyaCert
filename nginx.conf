server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/dashboard, /admin, …) all serve the SPA
    location / {
        try_files $uri /index.html;
    }
}
